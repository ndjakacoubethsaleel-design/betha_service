{% extends 'base.html' %}
{% block content %}
<div style="max-width:400px; margin:0 auto; background:white; padding:40px; border-radius:10px;">
    <h2 style="color:#1a1a2e; margin-bottom:15px; text-align:center;">Vérification Email</h2>
    <p style="color:#666; text-align:center; margin-bottom:25px;">
        Un code à 6 chiffres a été envoyé à votre email.
    </p>
    <form method="POST">
        <div style="margin-bottom:25px;">
            <label>Code de vérification</label><br>
            <input type="text" name="code" required maxlength="6"
                style="width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:5px; font-size:24px; text-align:center; color:#000;">
        </div>
        <button type="submit" class="btn" style="width:100%;">Vérifier</button>
    </form>
</div>
{% endblock %}
